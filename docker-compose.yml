# Shared volumes mounted by backend, worker, and worker2.
x-worker-volumes: &worker-volumes
  - ./backend/src:/app/src
  - ./backend/uploads:/app/uploads
  - ./backend/clips:/app/clips
  - ./backend/fonts:/app/fonts
  - ./backend/transitions:/app/transitions
  - ./backend/downloads:/app/downloads
  - ./cookies.txt:/app/cookies.txt
  - ./video1:/app/video1
  - ${WHISPER_CACHE_HOST_DIR:-./backend/.cache/whisper}:/root/.cache/whisper

# Shared depends_on block for all worker containers.
x-worker-depends: &worker-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrations:
    condition: service_completed_successfully
  backend:
    condition: service_healthy

services:
  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teek-migrations
    command: [".venv/bin/python", "-m", "src.migrations_cli"]
    env_file: .env
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: teek-frontend
    command: ["sh", "-lc", "bunx prisma generate && bun run dev"]
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    env_file: .env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/prisma:/app/prisma
      - ./frontend/next.config.ts:/app/next.config.ts
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_INTERNAL_URL=http://backend:8000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: teek-backend
    command: [".venv/bin/uvicorn", "src.main_refactored:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file: .env
    volumes: *worker-volumes
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - TEMP_DIR=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEDIAPIPE_FACE_MODEL_PATH=/app/models/blaze_face_short_range.tflite
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: teek-worker
    command: [".venv/bin/arq", "src.workers.tasks.WorkerSettings"]
    env_file: .env
    volumes: *worker-volumes
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - TEMP_DIR=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEDIAPIPE_FACE_MODEL_PATH=/app/models/blaze_face_short_range.tflite
      - ARQ_QUEUE_NAME=${ARQ_QUEUE_NAME_LOCAL:-arq:queue:local}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    depends_on: *worker-depends

  worker2:
    profiles: ["multi-worker"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: teek-worker-2
    command: [".venv/bin/arq", "src.workers.tasks.WorkerSettings"]
    env_file: .env
    volumes: *worker-volumes
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - TEMP_DIR=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEDIAPIPE_FACE_MODEL_PATH=/app/models/blaze_face_short_range.tflite
      - ARQ_QUEUE_NAME=${ARQ_QUEUE_NAME_LOCAL:-arq:queue:local}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - WHISPER_DEVICE=${WORKER2_WHISPER_DEVICE:-auto}
      - WORKER_MAX_JOBS=${WORKER2_MAX_JOBS:-1}
    restart: unless-stopped
    depends_on: *worker-depends

  redis:
    image: redis:7-alpine
    container_name: teek-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: teek-postgres
    env_file: .env
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  default:
    name: teek-network